name: Keuangan RT checks

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  syntax-and-accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --experimental-default-type=module --check "$file"
          done
      - name: Run accounting tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
